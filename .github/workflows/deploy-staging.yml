name: Deploy — Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/envs/staging

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI gates — lint, typecheck, build
  # ---------------------------------------------------------------------------
  ci:
    name: CI Gates
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build (smoke)
        run: bun run build --filter=@hay/server

  # ---------------------------------------------------------------------------
  # 2. Build & push Docker image → ECR, emit digest
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.ECR_REPOSITORY_URL }}"

      - name: Build & push image
        id: push
        env:
          ECR_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          GIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${ECR_URL}:${GIT_SHA}"
          docker build -t "$IMAGE_TAG" -f apps/server/Dockerfile apps/server
          docker push "$IMAGE_TAG"
          # Capture immutable digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          echo "image_uri=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 3. Terraform plan
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging
    permissions:
      id-token: write
      contents: read
    outputs:
      plan_summary: ${{ steps.summary.outputs.plan_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=env/staging/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_api_image_uri: ${{ needs.build-push.outputs.image_uri }}
        run: |
          # Raw plan output is suppressed — only the binary plan file is kept.
          terraform plan \
            -var="api_image_uri=${TF_VAR_api_image_uri}" \
            -out=tfplan \
            -input=false \
            -no-color \
            > /dev/null 2>&1

      - name: Generate sanitized plan summary
        id: summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Only resource address and change actions — no values, no diffs.
          SUMMARY=$(terraform show -json tfplan \
            | jq -r '
                .resource_changes
                | map(select(.change.actions != ["no-op"]))
                | map({address, actions: .change.actions})
                | if length == 0 then
                    "No infrastructure changes."
                  else
                    (["| Resource | Actions |", "|---|---|"] +
                     map("| `\(.address)` | \(.actions | join(", ")) |"))
                    | join("\n")
                  end
              ')
          # Use a random delimiter to prevent heredoc injection.
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "plan_summary<<${DELIMITER}"
            echo "${SUMMARY}"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          SUMMARY: ${{ steps.summary.outputs.plan_summary }}
        run: |
          {
            echo "## Terraform Plan — \`staging\`"
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.sha }}\` · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tfplan artifact
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Drizzle migrations
  # ---------------------------------------------------------------------------
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch migration secrets from Secrets Manager
        id: migration-secrets
        run: |
          # ::add-mask:: prevents values from appearing in any subsequent log line.
          # Apply before writing to GITHUB_ENV so the runner redacts them immediately.
          DB_URL=$(aws secretsmanager get-secret-value \
            --secret-id "hay/staging/TURSO_DATABASE_URL" \
            --query SecretString \
            --output text)
          echo "::add-mask::$DB_URL"
          echo "TURSO_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

          TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id "hay/staging/TURSO_AUTH_TOKEN" \
            --query SecretString \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "TURSO_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run Drizzle migrations
        run: bun run --cwd apps/server migrate

  # ---------------------------------------------------------------------------
  # 5. Terraform apply (uses pre-approved plan artifact)
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=env/staging/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Download tfplan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -no-color tfplan

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          API_URL=$(terraform output -raw api_url)
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          BUCKET=$(terraform output -raw spa_s3_bucket_name)
          PREFIX=$(terraform output -raw spa_s3_key_prefix)
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "cf_distribution_id=${CF_ID}" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "s3_prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      cf_distribution_id: ${{ steps.tf-outputs.outputs.cf_distribution_id }}
      s3_bucket: ${{ steps.tf-outputs.outputs.s3_bucket }}
      s3_prefix: ${{ steps.tf-outputs.outputs.s3_prefix }}

  # ---------------------------------------------------------------------------
  # 6. Build web SPA, sync to S3, invalidate CloudFront
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web SPA
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web SPA
        env:
          VITE_API_BASE_URL: ${{ needs.terraform-apply.outputs.api_url }}
        run: bun run --cwd apps/web build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync SPA to S3
        env:
          BUCKET: ${{ needs.terraform-apply.outputs.s3_bucket }}
          PREFIX: ${{ needs.terraform-apply.outputs.s3_prefix }}
        run: |
          aws s3 sync apps/web/dist/client/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          # HTML files: no-cache so users always get the latest shell
          aws s3 sync apps/web/dist/client/ "s3://${BUCKET}/${PREFIX}/" \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        env:
          CF_ID: ${{ needs.terraform-apply.outputs.cf_distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"
