# Manual secret seeding workflow.
#
# Writes secret values from GitHub Actions secrets into AWS Secrets Manager.
# Terraform creates the secret names/ARNs only — it never stores or reads values.
#
# Trigger: workflow_dispatch ONLY (never runs automatically).
#
# Secret values come from GitHub Actions secrets (e.g. SEED_BETTER_AUTH_SECRET),
# NOT from workflow inputs, to prevent values from appearing in logs or the
# GitHub UI run summary.
#
# Redis/ElastiCache: NO seeding step is needed. The ECS task role has IAM
# permissions to connect; no password or token is used.
#
# Required GitHub Actions secrets (set once per repo, used for both envs):
#   SEED_BETTER_AUTH_SECRET   — Better Auth signing secret
#   SEED_TURSO_AUTH_TOKEN     — Turso database auth token
#   SEED_TURSO_DATABASE_URL   — Turso libsql:// database URL
#   SEED_CORS_ALLOWED_ORIGINS — Comma-separated list of allowed CORS origins
#   SEED_BETTER_AUTH_URL      — Public HTTPS URL of the auth server
#
# Required GitHub Actions variables (set once per repo):
#   STAGING_DEPLOY_ROLE_ARN    — IAM role ARN for staging OIDC assumption
#   PRODUCTION_DEPLOY_ROLE_ARN — IAM role ARN for production OIDC assumption

name: Seed Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    name: Seed secrets → ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # GitHub Environment gate — required reviewers must approve before the job
    # runs. Configure reviewers in Settings → Environments → staging/production.
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: us-east-1
      SECRET_PREFIX: hay/${{ inputs.environment }}

    steps:
      # ── 1. Checkout (needed for OIDC token exchange) ──────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ── 2. Assume OIDC role for the target environment ────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: >-
            ${{
              inputs.environment == 'production'
                && vars.PRODUCTION_DEPLOY_ROLE_ARN
                || vars.STAGING_DEPLOY_ROLE_ARN
            }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Mask all secret values before any shell expansion ─────────────
      #
      # ::add-mask:: prevents the value from appearing in any subsequent log
      # line, even if a command accidentally echoes it.
      - name: Mask secret values
        shell: bash
        env:
          _BETTER_AUTH_SECRET: ${{ secrets.SEED_BETTER_AUTH_SECRET }}
          _TURSO_AUTH_TOKEN: ${{ secrets.SEED_TURSO_AUTH_TOKEN }}
          _TURSO_DATABASE_URL: ${{ secrets.SEED_TURSO_DATABASE_URL }}
          _CORS_ALLOWED_ORIGINS: ${{ secrets.SEED_CORS_ALLOWED_ORIGINS }}
          _BETTER_AUTH_URL: ${{ secrets.SEED_BETTER_AUTH_URL }}
        run: |
          echo "::add-mask::${_BETTER_AUTH_SECRET}"
          echo "::add-mask::${_TURSO_AUTH_TOKEN}"
          echo "::add-mask::${_TURSO_DATABASE_URL}"
          echo "::add-mask::${_CORS_ALLOWED_ORIGINS}"
          echo "::add-mask::${_BETTER_AUTH_URL}"

      # ── 4. Seed BETTER_AUTH_SECRET ────────────────────────────────────────
      - name: Seed BETTER_AUTH_SECRET
        shell: bash
        env:
          _VALUE: ${{ secrets.SEED_BETTER_AUTH_SECRET }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${SECRET_PREFIX}/BETTER_AUTH_SECRET" \
            --secret-string "$_VALUE"

      # ── 5. Seed TURSO_AUTH_TOKEN ──────────────────────────────────────────
      - name: Seed TURSO_AUTH_TOKEN
        shell: bash
        env:
          _VALUE: ${{ secrets.SEED_TURSO_AUTH_TOKEN }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${SECRET_PREFIX}/TURSO_AUTH_TOKEN" \
            --secret-string "$_VALUE"

      # ── 6. Seed TURSO_DATABASE_URL ────────────────────────────────────────
      - name: Seed TURSO_DATABASE_URL
        shell: bash
        env:
          _VALUE: ${{ secrets.SEED_TURSO_DATABASE_URL }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${SECRET_PREFIX}/TURSO_DATABASE_URL" \
            --secret-string "$_VALUE"

      # ── 7. Seed CORS_ALLOWED_ORIGINS ──────────────────────────────────────
      - name: Seed CORS_ALLOWED_ORIGINS
        shell: bash
        env:
          _VALUE: ${{ secrets.SEED_CORS_ALLOWED_ORIGINS }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${SECRET_PREFIX}/CORS_ALLOWED_ORIGINS" \
            --secret-string "$_VALUE"

      # ── 8. Seed BETTER_AUTH_URL ───────────────────────────────────────────
      - name: Seed BETTER_AUTH_URL
        shell: bash
        env:
          _VALUE: ${{ secrets.SEED_BETTER_AUTH_URL }}
        run: |
          aws secretsmanager put-secret-value \
            --region "$AWS_REGION" \
            --secret-id "${SECRET_PREFIX}/BETTER_AUTH_URL" \
            --secret-string "$_VALUE"

      # ── 9. Confirm (no values printed) ───────────────────────────────────
      - name: Confirm seeded secrets
        shell: bash
        run: |
          echo "Seeded secrets for environment: ${{ inputs.environment }}"
          echo "  ${SECRET_PREFIX}/BETTER_AUTH_SECRET"
          echo "  ${SECRET_PREFIX}/TURSO_AUTH_TOKEN"
          echo "  ${SECRET_PREFIX}/TURSO_DATABASE_URL"
          echo "  ${SECRET_PREFIX}/CORS_ALLOWED_ORIGINS"
          echo "  ${SECRET_PREFIX}/BETTER_AUTH_URL"
          echo ""
          echo "Redis/ElastiCache: no token seeding required (IAM auth)."
