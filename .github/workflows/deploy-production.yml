# Production deployment workflow
#
# Trigger: manual `workflow_dispatch` from the `main` branch only.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  APPROVAL GATE — GitHub Environment: "production"                       │
# │                                                                         │
# │  Before this workflow can deploy, configure the "production" environment│
# │  in GitHub → Settings → Environments → production:                      │
# │    • Required reviewers: add at least one team or individual            │
# │    • Deployment branches: restrict to "main" only                       │
# │    • (Optional) Wait timer: e.g. 5 minutes for last-chance cancel       │
# │                                                                         │
# │  The `approve` job below references `environment: production`, which    │
# │  causes GitHub to pause and request reviewer sign-off before any        │
# │  subsequent jobs (migrate, terraform-apply, deploy-web) run.            │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Job order:
#   build-push        → build & push server image to ECR (production OIDC role)
#   terraform-plan    → plan infra changes against production backend
#   approve           → environment gate — waits for required reviewer approval
#   migrate           → run DB migrations against production Turso DB
#   terraform-apply   → apply the pre-approved plan
#   deploy-web        → build SPA, upload to S3, invalidate CloudFront
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   PRODUCTION_DEPLOY_ROLE_ARN   — IAM role ARN for production OIDC (never share with staging)
#   ECR_REPOSITORY_URL           — Full ECR repo URL (no tag)
#   TF_STATE_BUCKET              — S3 bucket holding Terraform state
#   TURSO_DATABASE_URL           — Production Turso libSQL URL (for migrations)
#   TURSO_AUTH_TOKEN             — Production Turso auth token (for migrations)
#   PROD_ZONE_NAME               — Route 53 zone name (e.g. hay.example.com)
#
# Required GitHub variables (Settings → Secrets and variables → Variables):
#   AWS_REGION                   — AWS region (e.g. us-east-1)

name: Deploy — Production

on:
  workflow_dispatch:
    branches:
      - main

# Workflow-level: read-only. Jobs that need OIDC declare id-token: write themselves.
permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_DIR: infra/envs/production

jobs:
  # ── 1. Build & push server image ──────────────────────────────────────────
  build-push:
    name: Build & push image
    uses: ./.github/workflows/build-push.yml
    permissions:
      contents: read
      id-token: write  # OIDC token needed to assume ECR push role
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      ecr_repository_url: ${{ vars.ECR_REPOSITORY_URL || secrets.ECR_REPOSITORY_URL }}
      role_arn: ${{ secrets.PRODUCTION_DEPLOY_ROLE_ARN }}

  # ── 2. Terraform plan ─────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform plan (production)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      id-token: write  # OIDC token needed to assume production deploy role

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.10"

      - name: Terraform init (production backend)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=env/production/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_api_image_uri: ${{ needs.build-push.outputs.image_uri }}
          TF_VAR_prod_zone_name: ${{ secrets.PROD_ZONE_NAME }}
        run: |
          # Raw plan output is suppressed — only the binary plan file is kept.
          set +e
          terraform plan \
            -var="api_image_uri=${TF_VAR_api_image_uri}" \
            -var="prod_zone_name=${TF_VAR_prod_zone_name}" \
            -out=tfplan \
            -input=false \
            -detailed-exitcode \
            > /dev/null 2>&1
          EXITCODE=$?
          echo "exitcode=${EXITCODE}" >> "$GITHUB_OUTPUT"
          # Exit 0 = no changes, 2 = changes present, 1 = error
          if [ "$EXITCODE" -eq 1 ]; then exit 1; fi

      - name: Generate sanitized plan summary
        id: summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Only resource address and change actions — no values, no diffs.
          SUMMARY=$(terraform show -json tfplan \
            | jq -r '
                .resource_changes
                | map(select(.change.actions != ["no-op"]))
                | map({address, actions: .change.actions})
                | if length == 0 then
                    "No infrastructure changes."
                  else
                    (["| Resource | Actions |", "|---|---|"] +
                     map("| `\(.address)` | \(.actions | join(", ")) |"))
                    | join("\n")
                  end
              ')
          # Use a random delimiter to prevent heredoc injection.
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "plan_summary<<${DELIMITER}"
            echo "${SUMMARY}"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          SUMMARY: ${{ steps.summary.outputs.plan_summary }}
        run: |
          {
            echo "## Terraform Plan — \`production\`"
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.sha }}\` · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-production-${{ github.run_id }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ── 3. Approval gate ──────────────────────────────────────────────────────
  #
  # This job references `environment: production`. GitHub will pause here and
  # require sign-off from the configured required reviewers before proceeding.
  # Configure reviewers at: Settings → Environments → production → Required reviewers
  approve:
    name: Await production approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    steps:
      - name: Approval granted
        run: echo "Production deployment approved — proceeding."

  # ── 4. Migrate ────────────────────────────────────────────────────────────
  migrate:
    name: Run DB migrations (production)
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun run --cwd apps/server migrate

  # ── 5. Terraform apply ────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform apply (production)
    runs-on: ubuntu-latest
    needs: [build-push, terraform-plan, approve, migrate]
    permissions:
      contents: read
      id-token: write  # OIDC token needed to assume production deploy role

    outputs:
      cloudfront_distribution_id: ${{ steps.tf-outputs.outputs.cloudfront_distribution_id }}
      spa_s3_bucket_name: ${{ steps.tf-outputs.outputs.spa_s3_bucket_name }}
      api_url: ${{ steps.tf-outputs.outputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_version: "~1.10"

      - name: Terraform init (production backend)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ env.AWS_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=env/production/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: tfplan-production-${{ github.run_id }}
          path: ${{ env.TF_DIR }}

      - name: Terraform apply (pre-approved plan)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          S3_BUCKET=$(terraform output -raw spa_s3_bucket_name)
          API_URL=$(terraform output -raw api_url)
          echo "cloudfront_distribution_id=${CF_ID}" >> "$GITHUB_OUTPUT"
          echo "spa_s3_bucket_name=${S3_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"

  # ── 6. Deploy web SPA ─────────────────────────────────────────────────────
  deploy-web:
    name: Deploy web SPA (production)
    runs-on: ubuntu-latest
    needs: terraform-apply
    permissions:
      contents: read
      id-token: write  # OIDC token needed to assume production deploy role

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Restore Bun cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web SPA
        env:
          VITE_API_BASE_URL: ${{ needs.terraform-apply.outputs.api_url }}
        run: bun run --cwd apps/web build

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload SPA to S3
        env:
          S3_BUCKET: ${{ needs.terraform-apply.outputs.spa_s3_bucket_name }}
        run: |
          aws s3 sync apps/web/dist/client/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html must not be cached — browsers must always revalidate
          aws s3 cp apps/web/dist/client/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        env:
          CF_DISTRIBUTION_ID: ${{ needs.terraform-apply.outputs.cloudfront_distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*"
