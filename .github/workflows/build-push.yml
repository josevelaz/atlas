# Reusable workflow: build the server Docker image and push to ECR.
#
# Callers supply:
#   - aws_region          AWS region where the ECR repo lives
#   - ecr_repository_url  Full ECR repo URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/hay-server)
#   - role_arn            IAM role ARN to assume via OIDC
#
# Outputs:
#   - image_digest  Immutable content-addressable digest (sha256:…)
#   - image_uri     Full ECR URI with digest (repo@sha256:…)
#
# No `latest` tag is ever pushed.

name: Build & Push

on:
  workflow_call:
    inputs:
      aws_region:
        description: "AWS region for ECR"
        type: string
        required: true
      ecr_repository_url:
        description: "Full ECR repository URL (no tag)"
        type: string
        required: true
      role_arn:
        description: "IAM role ARN to assume via OIDC"
        type: string
        required: true
    outputs:
      image_digest:
        description: "Immutable image digest (sha256:…)"
        value: ${{ jobs.build-push.outputs.image_digest }}
      image_uri:
        description: "Full ECR URI with digest (repo@sha256:…)"
        value: ${{ jobs.build-push.outputs.image_uri }}

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
      image_uri: ${{ steps.digest.outputs.uri }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ── 2. Configure AWS credentials via OIDC ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # ── 3. Login to ECR ──────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # ── 4. Build and push (SHA tag only — no latest) ─────────────────────────
      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ inputs.ecr_repository_url }}:${{ github.sha }}
        run: |
          docker build \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            .
          docker push "$IMAGE"

      # ── 5. Capture immutable digest ──────────────────────────────────────────
      - name: Capture image digest
        id: digest
        env:
          IMAGE: ${{ inputs.ecr_repository_url }}:${{ github.sha }}
          REPO: ${{ inputs.ecr_repository_url }}
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "uri=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
