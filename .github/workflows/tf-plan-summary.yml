# Reusable workflow: run `terraform plan`, extract a sanitized summary, and
# surface it in the Actions job summary and (on PRs) as a PR comment.
#
# SECURITY CONTRACT
# -----------------
# Raw `terraform plan` and `terraform show` output NEVER appear in logs,
# summaries, or PR comments.  Only the jq-extracted resource-change list
# (address + actions) is published.  Binary plan artifacts are uploaded only
# when the repository is confirmed private, with a 1-day retention window.
#
# Callers supply:
#   - environment        One of: preview | staging | production
#   - working_directory  Path to the Terraform root (e.g. infra/envs/staging)
#   - aws_region         AWS region for the backend and provider
#   - role_arn           IAM role ARN to assume via OIDC
#   - state_bucket       S3 bucket holding Terraform state
#   - state_key          S3 key for this environment's state file
#   - pr_number          PR number (required when environment == preview)
#
# Optional caller secrets (passed through):
#   - TF_VAR_*           Any Terraform variable overrides needed for plan

name: Terraform Plan Summary

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (preview | staging | production)"
        type: string
        required: true
      working_directory:
        description: "Path to the Terraform root module"
        type: string
        required: true
      aws_region:
        description: "AWS region for the backend and provider"
        type: string
        required: true
      role_arn:
        description: "IAM role ARN to assume via OIDC"
        type: string
        required: true
      state_bucket:
        description: "S3 bucket holding Terraform state"
        type: string
        required: true
      state_key:
        description: "S3 key for this environment's state file"
        type: string
        required: true
      pr_number:
        description: "PR number — required when environment is 'preview'"
        type: number
        required: false
        default: 0
    secrets:
      TF_VARS_JSON:
        description: >
          JSON object of Terraform variable overrides, e.g.
          {"api_image_uri":"123.dkr.ecr.../hay-server:abc1234"}.
          Each key is exported as TF_VAR_<key>=<value>.
        required: false

permissions:
  contents: read
  id-token: write
  # pull-requests: write is NOT declared here — callers that need PR comments
  # must grant it in their own permissions block and pass pr_number.

jobs:
  tf-plan:
    name: "Plan (${{ inputs.environment }})"
    runs-on: ubuntu-latest

    # Prevent concurrent plans against the same environment from racing on
    # the shared state file.
    concurrency:
      group: tf-plan-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ── 2. Configure AWS credentials via OIDC ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # ── 3. Set up Terraform ──────────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269ef065 # v3.1.2
        with:
          terraform_wrapper: false

      # ── 4. Export TF_VAR_* from caller-supplied JSON ─────────────────────────
      - name: Export Terraform variables
        if: ${{ secrets.TF_VARS_JSON != '' }}
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          # Parse the JSON object and export each key as TF_VAR_<key>.
          # Values are written to GITHUB_ENV so they persist across steps.
          echo "$TF_VARS_JSON" | jq -r 'to_entries[] | "TF_VAR_\(.key)=\(.value)"' >> "$GITHUB_ENV"

      # ── 5. Terraform init ────────────────────────────────────────────────────
      - name: Terraform init
        env:
          TF_BACKEND_BUCKET: ${{ inputs.state_bucket }}
          TF_BACKEND_KEY: ${{ inputs.state_key }}
          TF_BACKEND_REGION: ${{ inputs.aws_region }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -input=false \
            -no-color \
            2>&1 | grep -v "^$" | grep -v "Initializing"

      # ── 6. Terraform plan (raw output suppressed) ────────────────────────────
      # Raw stdout/stderr from `terraform plan` is redirected to /dev/null.
      # Only the binary plan file (tfplan) is retained — it never leaves the
      # runner except as a restricted artifact (private repos only, step 8).
      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color \
            > /dev/null 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── 7. Extract sanitized summary ─────────────────────────────────────────
      # Only resource address and change actions are extracted — no values,
      # no attribute diffs, no sensitive data.
      - name: Extract sanitized plan summary
        id: summary
        run: |
          SUMMARY=$(terraform show -json tfplan \
            | jq -r '
                .resource_changes
                | map(select(.change.actions != ["no-op"]))
                | map({address, actions: .change.actions})
                | if length == 0 then
                    "No infrastructure changes."
                  else
                    (["| Resource | Actions |", "|---|---|"] +
                     map("| `\(.address)` | \(.actions | join(", ")) |"))
                    | join("\n")
                  end
              ')
          # Write to a temp file to avoid shell-injection via delimiter tricks
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            echo "summary<<${DELIMITER}"
            echo "${SUMMARY}"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      # ── 8. Upload binary plan artifact (private repos only) ──────────────────
      # The binary plan file is uploaded only when the repository is confirmed
      # private.  Retention is capped at 1 day.  The artifact is scoped to this
      # environment so preview/staging/production plans never mix.
      - name: Upload plan artifact
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1
          if-no-files-found: error

      # ── 9. Write sanitized summary to Actions job summary ────────────────────
      - name: Write job summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SUMMARY: ${{ steps.summary.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Terraform Plan — \`${ENVIRONMENT}\`"
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.sha }}\` · [View run](${RUN_URL})_"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Post sanitized summary as PR comment ─────────────────────────────
      # Only runs when a PR number is provided (preview environment on PRs).
      # Uses a marker comment body so subsequent plans update the same comment.
      - name: Post PR comment
        if: ${{ inputs.pr_number > 0 }}
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ inputs.pr_number }}
          comment-author: github-actions[bot]
          body: |
            <!-- tf-plan-summary:${{ inputs.environment }} -->
            ## Terraform Plan — `${{ inputs.environment }}`

            ${{ steps.summary.outputs.summary }}

            ---
            _Triggered by commit `${{ github.sha }}` · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
          edit-mode: replace
          reactions: rocket
